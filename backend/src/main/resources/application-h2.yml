spring:
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true} # Isolated local development only.
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
