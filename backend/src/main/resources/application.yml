spring:
  application:
    name: automated-code-review
  config:
    import: optional:file:.local/runtime-secrets.env[.properties]

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user,public_repo

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000 # 24 hours
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8001}
  llm:
    enabled: ${LLM_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5-mini}
    allowed-repositories: ${LLM_ALLOWED_REPOSITORIES:}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:20}

server:
  port: 8080
