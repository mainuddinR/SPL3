<div class="app-sidebar h-full w-64 bg-gray-900 text-white flex flex-col">
  <div class="sidebar-brand h-16 flex items-center gap-3 px-5 border-b border-gray-800" title="Code Review — SATD Detection">
    <img src="/brand-icon.png" alt="" aria-hidden="true" class="h-9 w-9 rounded-md bg-white p-0.5 object-contain flex-shrink-0" />
    <div class="sidebar-brand-text min-w-0">
      <span class="brand-label block text-sm font-bold tracking-wide">Code Review</span>
      <span class="block text-xs text-teal-300">SATD Detection</span>
    </div>
  </div>
  <nav class="flex-1 py-4">
    <ul class="space-y-1 px-3">
      <li *ngFor="let item of menuItems">
        <a [routerLink]="item.path" routerLinkActive="bg-gray-800 text-white"
           [attr.aria-label]="item.label" [attr.title]="item.label"
           class="flex items-center px-3 py-2 text-gray-300 rounded-md hover:bg-gray-800 hover:text-white transition-colors duration-200">
          <span class="material-icons mr-3" aria-hidden="true">{{ item.icon }}</span>
          <span class="sidebar-label">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </nav>
</div>
