<header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-6 z-10 shadow-sm relative">
  <div class="flex items-center">
    <button (click)="toggleSidebar()" class="text-gray-500 hover:text-gray-700 focus:outline-none mr-4">
      <span class="material-icons text-2xl">menu</span>
    </button>
    <h2 class="text-lg font-medium text-gray-800">Overview</h2>
  </div>
  
  <div class="flex items-center space-x-4">
    <ng-container *ngIf="auth.currentUser$ | async as user">
      <div class="relative">
        <button (click)="toggleProfile()" class="flex items-center space-x-3 focus:outline-none hover:bg-gray-100 p-2 rounded-md transition-colors">
          <span class="text-sm font-medium text-gray-700">{{ user.username }}</span>
          <img [src]="user.avatarUrl" alt="Avatar" class="h-8 w-8 rounded-full border border-gray-300">
        </button>

        <!-- Dropdown Menu -->
        <div *ngIf="isProfileOpen()" class="absolute right-0 mt-2 w-48 bg-white border border-gray-200 rounded-md shadow-lg py-1 z-50">
          <div class="px-4 py-2 border-b border-gray-100">
            <p class="text-sm text-gray-500">Signed in as</p>
            <p class="text-sm font-medium text-gray-900 truncate">{{ user.username }}</p>
          </div>
          <a href="https://github.com/{{ user.username }}" target="_blank" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 flex items-center gap-2">
            <span class="material-icons text-[18px]">open_in_new</span> GitHub Profile
          </a>
          <button (click)="logout()" class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2">
            <span class="material-icons text-[18px]">logout</span> Logout
          </button>
        </div>
      </div>
    </ng-container>
  </div>
</header>
