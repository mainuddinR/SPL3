<div class="h-screen flex overflow-hidden bg-gray-50">
  <button *ngIf="sidebarService.isOpen()" type="button" (click)="sidebarService.toggle()" aria-label="Close navigation"
          class="fixed inset-0 bg-black/50 z-10 lg:hidden"></button>
  <app-sidebar *ngIf="sidebarService.isOpen()" class="fixed inset-y-0 left-0 flex flex-shrink-0 z-20 lg:relative"></app-sidebar>
  <div class="flex flex-col w-0 flex-1 overflow-hidden">
    <app-navbar></app-navbar>
    <main class="flex-1 relative overflow-y-auto focus:outline-none">
      <div class="py-6 px-4 sm:px-6 lg:px-8">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
