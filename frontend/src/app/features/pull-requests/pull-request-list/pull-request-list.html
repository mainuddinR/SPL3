<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">Pull Requests</h1>
    <button (click)="syncPullRequests()" [disabled]="syncing()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded shadow flex items-center gap-2 disabled:opacity-50">
      <span *ngIf="syncing()" class="animate-spin material-icons">refresh</span>
      <span *ngIf="!syncing()" class="material-icons">sync</span>
      Sync with GitHub
    </button>
  </div>

  <div *ngIf="error()" class="bg-red-100 text-red-700 p-4 rounded mb-6">
    {{ error() }}
  </div>

  <div *ngIf="loading()" class="flex justify-center p-12">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
  </div>

  <div *ngIf="!loading() && pullRequests().length === 0" class="bg-white p-8 rounded shadow text-center text-gray-500">
    No pull requests found. Click "Sync with GitHub" to fetch them.
  </div>

  <div *ngIf="!loading() && pullRequests().length > 0" class="bg-white rounded shadow overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">PR #</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Title</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">State</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created</th>
          <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let pr of pullRequests()" class="hover:bg-gray-50">
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">#{{ pr.number }}</td>
          <td class="px-6 py-4 text-sm font-medium text-gray-900 max-w-xs md:max-w-md lg:max-w-lg truncate" title="{{ pr.title }}">{{ pr.title }}</td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full" 
                  [ngClass]="{'bg-green-100 text-green-800': pr.state === 'open', 'bg-red-100 text-red-800': pr.state === 'closed'}">
              {{ pr.state }}
            </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ pr.createdAt | date }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
            <button (click)="viewDetails(pr.id)" class="text-blue-600 hover:text-blue-900">View Details</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
