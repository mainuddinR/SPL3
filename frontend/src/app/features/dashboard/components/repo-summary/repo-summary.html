<div class="bg-white rounded-lg border border-gray-200 overflow-hidden hover:shadow-md transition-shadow duration-200">
  <div class="p-5">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-medium text-gray-900 truncate">
        <a [href]="repo.url" target="_blank" class="hover:text-blue-600">{{ repo.name }}</a>
      </h3>
      <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
            [ngClass]="{'bg-green-100 text-green-800': repo.status === 'Healthy', 'bg-yellow-100 text-yellow-800': repo.status !== 'Healthy'}">
        {{ repo.status }}
      </span>
    </div>
    <div class="flex items-center text-sm text-gray-500 mb-2">
      <span class="material-icons-outlined text-sm mr-1">history</span>
      Analyzed {{ repo.lastAnalyzed }}
    </div>
      <div class="mt-4">
        <div class="flex justify-between text-sm mb-1">
          <span class="text-gray-500">Health Score</span>
          <span class="font-medium" [ngClass]="{'text-green-600': repo.healthScore >= 90, 'text-yellow-600': repo.healthScore < 90}">{{ repo.healthScore }}/100</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2">
          <div class="h-2 rounded-full" [ngClass]="{'bg-green-500': repo.healthScore >= 90, 'bg-yellow-500': repo.healthScore < 90}" [style.width.%]="repo.healthScore"></div>
        </div>
      </div>
      <div class="mt-4 border-t border-gray-100 pt-4 text-center">
        <a [routerLink]="['/dashboard/projects', repo.id, 'pulls']" class="text-sm font-medium text-blue-600 hover:text-blue-800">
          View Pull Requests →
        </a>
      </div>
    </div>
</div>
