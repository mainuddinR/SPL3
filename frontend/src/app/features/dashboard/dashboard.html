<div *ngIf="loading" class="flex justify-center items-center h-64">
  <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-gray-900"></div>
</div>

<div *ngIf="error" class="bg-red-50 border-l-4 border-red-400 p-4">
  <div class="flex">
    <div class="flex-shrink-0">
      <span class="material-icons text-red-400">error</span>
    </div>
    <div class="ml-3">
      <p class="text-sm text-red-700">
        Error loading dashboard data. Please try again later.
      </p>
    </div>
  </div>
</div>

<div *ngIf="!loading && !error && dashboardData">
  <!-- Stats Section -->
  <h2 class="text-xl font-bold text-gray-900 mb-4">Overview</h2>
  <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-4 mb-8">
    <app-stats-card 
      title="Repositories" 
      [value]="dashboardData.stats.totalRepositories" 
      icon="folder"
      colorClass="bg-indigo-100 text-indigo-600">
    </app-stats-card>
    <app-stats-card 
      title="Pull Requests" 
      [value]="dashboardData.stats.totalPullRequests" 
      icon="call_split"
      colorClass="bg-blue-100 text-blue-600">
    </app-stats-card>
    <app-stats-card 
      title="Critical Issues" 
      [value]="dashboardData.stats.criticalIssues" 
      icon="warning"
      colorClass="bg-red-100 text-red-600">
    </app-stats-card>
    <app-stats-card 
      title="Tech Debt Score" 
      [value]="dashboardData.stats.technicalDebtScore" 
      icon="speed"
      colorClass="bg-green-100 text-green-600">
    </app-stats-card>
  </div>

  <!-- Repositories Section -->
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-xl font-bold text-gray-900">Recent Repositories</h2>
    <a href="#" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">View all</a>
  </div>
  <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
    <app-repo-summary *ngFor="let repo of dashboardData.repositories" [repo]="repo"></app-repo-summary>
  </div>
</div>
