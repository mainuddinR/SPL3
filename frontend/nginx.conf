# Tailscale HTTPS -> Windows 127.0.0.1:4200 -> this Nginx -> Spring Boot / Angular.
# Database and CodeBERT never pass through this reverse proxy.
map $host $spl3_proto {
    default http;
    desktop-hkpkb3j.taild4dcd1.ts.net https;
}
map $spl3_proto $spl3_forward_port {
    https 443;
    default 80;
}
server {
    listen 80;
    server_name localhost 127.0.0.1 desktop-hkpkb3j.taild4dcd1.ts.net;
    root /usr/share/nginx/html;
    index index.html;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Exactly the backend routes used by the Angular app and GitHub OAuth.
    location ~ ^/(api/|oauth2/|login/oauth2/) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $spl3_proto;
        proxy_set_header X-Forwarded-Port $spl3_forward_port;
        proxy_read_timeout 180s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
