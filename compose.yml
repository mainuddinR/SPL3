services:
  frontend:
    build: ./frontend
    # Keep UI available after an unexpected Docker/host restart.
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    # Recovery after Docker restarts; OAuth must be reconnected after backend restart.
    restart: unless-stopped
    env_file:
      - ./.local/runtime-secrets.env
    environment:
      SPRING_PROFILES_ACTIVE: oracle
      ORACLE_HOST: 192.168.0.169
      ORACLE_PORT: "1521"
      ORACLE_SERVICE: XEPDB1
      ORACLE_USER: SPL3_APP
      ML_SERVICE_URL: http://ml-service:8001
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      ml-service:
        condition: service_healthy

  ml-service:
    build: ./ml-service
    # Recover the real CodeBERT service after an unexpected Docker/host restart.
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./ml-service/models/codebert_satd/best_model
        target: /app/models/codebert_satd/best_model
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:8001:8001"
